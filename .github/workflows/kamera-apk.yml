name: Kamera Uygulamasi APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Java Kurulumu
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Proje Altyapısını ve Uygulama Kodunu Oluştur
      run: |
        mkdir -p app/src/main/java/com/borankayya/kamera
        mkdir -p app/src/main/res/values

        # gradle.properties (AndroidX aktif ediliyor)
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        # Android Manifest Dosyası (Kamera İzinleri)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.camera" android:required="true" />
            <uses-permission android:name="android.permission.CAMERA" />
            
            <application android:allowBackup="true" android:label="Kamera Pro" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # App Seviyesi Gradle (KameraX Kütüphaneleri ve Java 17 Uyumluluğu)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.borankayya.kamera'
            compileSdk 34
            defaultConfig {
                applicationId "com.borankayya.kamera"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            def camerax_version = "1.3.0"
            implementation "androidx.camera:camera-core:${camerax_version}"
            implementation "androidx.camera:camera-camera2:${camerax_version}"
            implementation "androidx.camera:camera-lifecycle:${camerax_version}"
            implementation "androidx.camera:camera-view:${camerax_version}"
        }
        EOF

        # Settings Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "KameraApp"
        include ':app'
        EOF

        # Proje Seviyesi Gradle
        cat << 'EOF' > build.gradle
        buildscript {
            ext.kotlin_version = '1.9.0'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            }
        }
        EOF

        # Ana Uygulama Kodu (Profesyonel CameraX Kotlin Kodu)
        cat << 'EOF' > app/src/main/java/com/borankayya/kamera/MainActivity.kt
        package com.borankayya.kamera

        import android.Manifest
        import android.content.pm.PackageManager
        import android.os.Bundle
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.camera.core.CameraSelector
        import androidx.camera.core.Preview
        import androidx.camera.lifecycle.ProcessCameraProvider
        import androidx.camera.view.PreviewView
        import androidx.core.content.ContextCompat
        import java.util.concurrent.ExecutorService
        import java.util.concurrent.Executors

        class MainActivity : AppCompatActivity() {
            private lateinit var viewFinder: PreviewView
            private lateinit var cameraExecutor: ExecutorService

            private val activityResultLauncher =
                registerForActivityResult(ActivityResultContracts.RequestPermission()) { isGranted ->
                    if (isGranted) startCamera() else Toast.makeText(this, "Kamera izni reddedildi!", Toast.LENGTH_SHORT).show()
                }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                viewFinder = PreviewView(this)
                setContentView(viewFinder)

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                    startCamera()
                } else {
                    activityResultLauncher.launch(Manifest.permission.CAMERA)
                }
                cameraExecutor = Executors.newSingleThreadExecutor()
            }

            private fun startCamera() {
                val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                cameraProviderFuture.addListener({
                    val cameraProvider = cameraProviderFuture.get()
                    val preview = Preview.Builder().build().also {
                        it.setSurfaceProvider(viewFinder.surfaceProvider)
                    }
                    val cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA
                    try {
                        cameraProvider.unbindAll()
                        cameraProvider.bindToLifecycle(this, cameraSelector, preview)
                    } catch(exc: Exception) { }
                }, ContextCompat.getMainExecutor(this))
            }

            override fun onDestroy() {
                super.onDestroy()
                cameraExecutor.shutdown()
            }
        }
        EOF

    - name: Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Uygulamayı Derle (APK Oluştur)
      run: gradle assembleDebug

    - name: APK'yı Sisteme Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Kamera-Pro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
